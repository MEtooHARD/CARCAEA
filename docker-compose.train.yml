services:
  postgres_hku956:
    build: ./postgres
    container_name: ${DATABASE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CARCAEA_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CARCAEA_DB}" ]
      interval: 8s
      timeout: 5s
      retries: 5
    ports:
      - "${DATABASE_HOST_PORT}:${DATABASE_IN_PORT}"

  extractor:
    build: ./extractor_server
    container_name: ${EXTRACTOR}
    ports:
      - "${EXTRACTOR_HOST_PORT}:${EXTRACTOR_IN_PORT}"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
