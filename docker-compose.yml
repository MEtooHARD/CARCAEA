
services:
  postgres:
    build: ./postgres
    container_name: ${DATABASE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CARCAEA_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CARCAEA_DB}"]
      interval: 8s
      timeout: 5s
      retries: 5
    ports:
      - "${DATABASE_HOST_PORT}:${DATABASE_IN_PORT}"

  server:
    build: ./server
    container_name: ${API_SERVER}
    ports:
      - "${API_SERVER_HOST_PORT}:${API_SERVER_IN_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${API_SERVER_IN_PORT}
      NODE_ENV: development
      AUDIO_STORAGE_PATH: ${AUDIO_STORAGE_PATH:-./storage/audio}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${DATABASE_IN_PORT}/${CARCAEA_DB}
    volumes:
      - ./server/src:/app/src
      - ./test:/app/test

  # (deprecated)
  # extractor:
  #   build: ./essentia
  #   container_name: ${EXTRACTOR}
    # ports:
    #   - "5000:5000"
  
  extractor:
    build: ./extractor_server
    container_name: ${EXTRACTOR}
    ports:
      - "${EXTRACTOR_HOST_PORT}:${EXTRACTOR_IN_PORT}"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

volumes:
  postgres_data:
